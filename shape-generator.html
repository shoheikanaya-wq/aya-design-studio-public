<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身体形状ジェネレーター</title><style>body{margin:0;background:#111321;color:white;font:16px system-ui}main{max-width:860px;margin:auto;padding:18px}a{color:#c7d0ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:650px){.grid{grid-template-columns:1fr}}section{background:#20243a;padding:16px;border-radius:12px}label{display:block;margin:12px 0}input,select,button{width:100%;padding:9px;box-sizing:border-box}select,button{background:#4f5caa;color:white;border:0;border-radius:8px}button{margin:5px 0}button:active{transform:translateY(2px)}canvas{width:100%;background:#292e43;border-radius:10px}.muted{color:#c1c5d7}</style></head><body><main><a href="index.html">← ホーム</a><h1>身体形状ジェネレーター（簡易版）</h1><div class="grid"><section><label>機体<select id="machine"><option value="aya">亜矢</option><option value="yoko">葉子</option><option value="tsumugi">紬</option></select></label><div id="sliders"></div><h3>材料割り当て</h3><div id="materials"></div><label>加える力（N）<input id="force" type="range" min="0" max="50" value="0"><output id="forceValue">0</output></label><button id="save">設定保存</button><button id="png">PNG保存</button><p id="info" class="muted"></p><a href="material-lab.html">材料特性ラボで物性を編集</a></section><section><canvas id="view" width="500" height="650"></canvas><p class="muted">表示は形状比較の概念図。変形は見やすさのため誇張され、物理解析ではありません。</p></section></div></main><script>const $=id=>document.getElementById(id),fields={chest:'胸部ボリューム',abdomen:'腹部の丸み',pelvis:'骨盤幅',hips:'臀部ボリューム'},regions={matChest:'胸部',matPelvis:'骨盤周辺',matHips:'臀部'},key='aya-shape-public-v01',akey='aya-material-assign-v01';let data={},assign={};try{data=JSON.parse(localStorage.getItem(key))||{}}catch{}try{assign=JSON.parse(localStorage.getItem(akey))||{}}catch{};for(const [id,label] of Object.entries(fields))$('sliders').insertAdjacentHTML('beforeend','<label>'+label+' <output id="'+id+'Val"></output><input type="range" id="'+id+'" min="0" max="100" value="50"></label>');for(const [id,label] of Object.entries(regions))$('materials').insertAdjacentHTML('beforeend','<label>'+label+'<select id="'+id+'"><option value="">未設定</option><option value="a">外装A</option><option value="b">外装B</option><option value="c">外装C</option></select></label>');function profiles(){try{return JSON.parse(localStorage.getItem('aya-material-profiles-v01'))?.profiles||{}}catch{return {}}}function compression(id){let p=profiles()[$('machine').value+'-'+$(id).value],f=Number($('force').value);if(!p||!(Number(p.stiffness)>0))return 0;let x=f/Number(p.stiffness);if(p.travel!==null&&p.travel!==''&&Number.isFinite(Number(p.travel)))x=Math.min(x,Number(p.travel));return Math.max(0,Math.min(50,x))}function draw(){let c=$('view'),ctx=c.getContext('2d'),v=Object.fromEntries(Object.keys(fields).map(id=>[id,Number($(id).value)]));Object.keys(fields).forEach(id=>$(id+'Val').textContent=v[id]);$('forceValue').textContent=$('force').value;ctx.clearRect(0,0,500,650);ctx.fillStyle='#c8aa98';ctx.beginPath();ctx.ellipse(250,85,38,52,0,0,Math.PI*2);ctx.fill();ctx.fillRect(233,133,34,25);ctx.fillStyle='#7789b1';ctx.beginPath();ctx.ellipse(250,270,75+v.abdomen*.2,130,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(250,352,76+v.pelvis*.35,58+v.hips*.12,0,0,Math.PI*2);ctx.fill();for(let s of [-1,1]){ctx.beginPath();ctx.ellipse(250+s*51,222,25+v.chest*.23,24+v.chest*.13,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#c8aa98';ctx.fillRect(250+s*100-12,188,24,180);ctx.fillRect(250+s*38-22,394,44,190);ctx.fillStyle='#7789b1'}ctx.fillStyle='#111321';const values=Object.keys(regions).map(id=>regions[id]+': '+compression(id).toFixed(1)+'mm');$('info').textContent=values.join(' / ');ctx.fillStyle='#e3e6ff';ctx.font='17px system-ui';ctx.fillText('AYA • CONCEPT PREVIEW',18,28)}function load(){let v=data[$('machine').value]||{},a=assign[$('machine').value]||{};for(const id of Object.keys(fields))$(id).value=v[id]??50;for(const id of Object.keys(regions))$(id).value=a[id]||'';draw()}for(const id of [...Object.keys(fields),...Object.keys(regions),'force'])$(id).oninput=draw;$('machine').onchange=load;$('save').onclick=()=>{data[$('machine').value]=Object.fromEntries(Object.keys(fields).map(id=>[id,Number($(id).value)]));assign[$('machine').value]=Object.fromEntries(Object.keys(regions).map(id=>[id,$(id).value]));try{localStorage.setItem(key,JSON.stringify(data));localStorage.setItem(akey,JSON.stringify(assign));alert('この端末に保存しました')}catch{alert('保存に失敗しました')}};$('png').onclick=()=>{const a=document.createElement('a');a.href=$('view').toDataURL('image/png');a.download='AYA-shape.png';a.click()};load()</script></body></html>
