<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>材料特性ラボ</title><style>body{margin:0;background:#111321;color:#fff;font:16px system-ui}main{max-width:700px;margin:auto;padding:18px}a{color:#c6d0ff}section{background:#20243a;border-radius:12px;padding:18px}label{display:block;margin:14px 0}select,input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:8px;background:#333954;color:#fff;border:1px solid #667}button{background:#4f5caa;cursor:pointer}button:active{transform:translateY(2px)}.muted{color:#c1c5d7}</style></head><body><main><a href="index.html">← ホーム</a><h1>材料特性ラボ</h1><section><label>機体<select id="machine"><option value="aya">亜矢</option><option value="yoko">葉子</option><option value="tsumugi">紬</option></select></label><label>材料<select id="region"><option value="a">外装A</option><option value="b">外装B</option><option value="c">外装C</option></select></label><label>厚さ（mm）<input id="thickness" type="number" min="0" step="0.1"></label><label>圧縮剛性（N/mm）<input id="stiffness" type="number" min="0.01" step="0.1"></label><label>許容変位（mm）<input id="travel" type="number" min="0" step="0.1"></label><label>設計目標接触圧（kPa）<input id="pressure" type="number" min="0" step="0.1"></label><label>減衰指標（比較用）<input id="damping" type="range" min="0" max="100"></label><button id="save">この端末に保存</button><p id="status" aria-live="polite"></p><h2>簡易圧縮計算</h2><label>力（N）<input id="force" type="number" min="0" max="10000" value="10"></label><button id="calc">計算</button><p id="result" aria-live="polite"></p><button id="export">設定JSONを保存</button></section><p class="muted">線形ばね近似 F=kx のみ。接触圧、安全性、実機の変形は検証できません。</p></main><script>const $=id=>document.getElementById(id),key='aya-material-profiles-v01',ids=['thickness','stiffness','travel','pressure','damping'];let data={schemaVersion:'0.1',profiles:{}};try{const v=JSON.parse(localStorage.getItem(key));if(v&&v.profiles)data=v}catch{};const pk=()=>$('machine').value+'-'+$('region').value;function load(){let p=data.profiles[pk()]||{};ids.forEach(id=>$(id).value=p[id]??(id==='damping'?50:''));$('status').textContent=''}$('machine').onchange=load;$('region').onchange=load;$('save').onclick=()=>{let p={updatedAt:new Date().toISOString()};for(const id of ids){let s=$(id).value;p[id]=s===''?null:Number(s);if(p[id]!==null&&(!Number.isFinite(p[id])||p[id]<0)){$('status').textContent='値を確認してください';return}}data.profiles[pk()]=p;try{localStorage.setItem(key,JSON.stringify(data));$('status').textContent='保存しました'}catch(e){$('status').textContent='保存できませんでした'}};$('calc').onclick=()=>{let k=Number($('stiffness').value),f=Number($('force').value);if(!Number.isFinite(k)||k<=0||!Number.isFinite(f)||f<0||$('stiffness').value===''||$('force').value===''){$('result').textContent='剛性は0より大きく、力は0以上で入力してください';return}let x=f/k,t=$('travel').value;$('result').textContent='推定変形量 '+x.toFixed(2)+' mm'+(t!==''&&x>Number(t)?'（許容変位超過）':'')};$('export').onclick=()=>{const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='aya-materials.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};load()</script></body></html>
